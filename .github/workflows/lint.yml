---
name: Linting
on:
  workflow_call:
jobs:
  hk-ci:
    name: hk
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the codebase
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Install tools via mise
        uses: jdx/mise-action@v2
      - name: Run hk checks
        run: hk check --all
